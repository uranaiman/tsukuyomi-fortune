<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    タロット占い｜月詠秘術
  </title>

  <meta
    name="description"
    content="22枚の神秘タロットカードから運命を読み解く無料占い。"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap"
    rel="stylesheet"
  >

</head>

<body>

  <div class="fog"></div>

  <header>

    <h1>
      🃏 タロット占い 🃏
    </h1>

    <p class="subtitle">
      運命のカードを1枚選んでください
    </p>

  </header>

  <section class="intro">

    <h2>
      月詠タロット
    </h2>

    <p>

      古代より伝わる
      22枚の神秘カード。

      <br><br>

      あなたの深層心理、
      運命、
      未来の流れを映し出します。

      <br><br>

      心を静め、
      直感でカードを選んでください。

    </p>

  </section>

  <!-- カード -->

  <section class="tarot-section">

    <div
      id="tarot-cards"
      class="tarot-grid"
    ></div>

  </section>

  <!-- 結果 -->

  <section
    id="tarot-result"
    class="fortune-box"
    style="display:none;"
  >

    <div
      id="drawn-card"
      class="drawn-card"
    >
    </div>

    <h2 id="card-name"></h2>

    <div id="card-orientation"></div>

    <p id="card-message"></p>

    <h3>
      💖 恋愛運
    </h3>

    <p id="love"></p>

    <h3>
      💼 仕事運
    </h3>

    <p id="work"></p>

    <h3>
      💰 金運
    </h3>

    <p id="money"></p>

  </section>

  <div class="back-area">

    <a
      href="index.html"
      class="back-btn"
    >

      ← TOPへ戻る

    </a>

  </div>

  <script src="tarot.js"></script>

</body>

</html>
