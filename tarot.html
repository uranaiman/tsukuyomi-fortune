<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- SEO -->

  <title>
    無料タロット占い｜月詠秘術
  </title>

  <meta
    name="description"
    content="神秘のタロットカードがあなたの運命を導きます。無料タロット占い。"
  >

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- Google Font -->

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap"
    rel="stylesheet"
  >

</head>

<body>

  <!-- 背景霧 -->

  <div class="fog"></div>

  <!-- タイトル -->

  <header>

    <h1>
      🔮 タロット占い 🔮
    </h1>

    <p class="subtitle">
      運命のカードを1枚選んでください
    </p>

  </header>

  <!-- 説明 -->

  <section class="intro">

    <h2>
      タロットの神託
    </h2>

    <p>

      古代より伝わる
      神秘のタロットカード。

      <br><br>

      あなたの深層心理、
      未来、
      運命の流れを映し出します。

      <br><br>

      心を落ち着かせ、
      直感でカードを選んでください。

    </p>

  </section>

  <!-- カード一覧 -->

  <section class="fortune-menu">

    <div class="section-title">

      <span>
        TAROT READING
      </span>

      <h2>
        🌙 運命のカード 🌙
      </h2>

      <p>
        気になるカードを選んでください
      </p>

    </div>

    <!-- カード -->

    <div
      id="tarot-cards"
      class="tarot-grid"
    >
    </div>

  </section>

  <!-- 結果 -->

  <section
    id="tarot-result"
    class="fortune-box"
    style="display:none;"
  >

    <!-- 開いたカード -->

    <div
      id="tarot-card-view"
      class="tarot-open-card"
    >
    </div>

    <!-- 名前 -->

    <h2 id="tarot-name"></h2>

    <!-- 神託 -->

    <p id="tarot-main"></p>

    <!-- 恋愛 -->

    <h3>
      💖 恋愛運
    </h3>

    <p id="love"></p>

    <!-- 仕事 -->

    <h3>
      💼 仕事運
    </h3>

    <p id="work"></p>

    <!-- 金運 -->

    <h3>
      💰 金運
    </h3>

    <p id="money"></p>

    <!-- 開運 -->

    <h3>
      🍀 開運メッセージ
    </h3>

    <p id="message"></p>

  </section>

  <!-- 戻る -->

  <div class="back-area">

    <a
      href="index.html"
      class="back-btn"
    >

      ← TOPへ戻る

    </a>

  </div>

  <!-- フッター -->

  <footer class="site-footer">

    <p>
      © 月詠秘術
    </p>

  </footer>

  <!-- JavaScript -->

  <script src="tarot.js"></script>

</body>

</html>
