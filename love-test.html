<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    恋愛タイプ診断｜月詠秘術
  </title>

  <meta
    name="description"
    content="あなたの恋愛タイプを診断。月が導く本当の恋愛傾向とは？"

  <link

  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap"

<body>

  <div class="fog"></div>

    <h1>
      💖 恋愛タイプ診断 💖

    <p class="subtitle">
      月が導くあなたの恋愛傾向

  <!-- 説明 -->

  <section class="intro">

    <h2>
      あなたの恋愛タイプを診断

        質問を読み込み中...

      <div id="answers" class="answers"></div>

    <div id="result" class="result-box"></div>

  <!-- 戻る -->

  <div class="back-area">

    <a
